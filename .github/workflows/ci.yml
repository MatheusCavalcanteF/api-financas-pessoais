# Integração contínua: backend, frontend e E2E em paralelo, a cada push na main e
# em todo pull request para a main (inclusive os do Dependabot). Versões iguais
# às de desenvolvimento: Java 25 (pom.xml) e Node.js 24 LTS.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O workflow só lê o código; nenhum job precisa de escrita no repositório.
permissions:
  contents: read

# Push novo no mesmo PR cancela a execução anterior; na main, todas terminam.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Os testes de integração sobem um PostgreSQL descartável via Testcontainers
      # (o runner do GitHub já tem Docker). Não usam o .env: o segredo JWT de teste
      # fica em src/test/resources/application.properties.
      - name: Build e testes
        run: ./mvnw verify -B --no-transfer-progress

      - name: Relatórios dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Inclui a checagem de tipos do TypeScript.
      - name: Build
        run: npm run build

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências
        run: npm ci

      # O playwright.config.ts usa channel "chrome": o Google Chrome que já vem no
      # runner, sem baixar navegador. O próprio Playwright sobe o backend falso
      # (e2e/mock-backend.mjs) e o build de produção em .next-e2e.
      - name: Testes E2E
        run: npx playwright test

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
